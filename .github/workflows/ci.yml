# CI (`C1`): the same gates as the pre-commit hook, on a clean macOS runner.
name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  gates:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Document gates
        run: sh scripts/check_docs.sh
      - name: Requirement trace
        run: python3 scripts/check_trace.py
      - name: Tests and floor
        run: |
          count=$(sh scripts/count_tests.sh | tail -1)
          floor=$(cat tests/TEST_FLOOR)
          echo "tests passed: $count, floor: $floor"
          sh scripts/run_tests.sh
          [ "$count" -ge "$floor" ]
