# Created: 2026-11-08 21:12 -06:00 · Edited: 2026-11-09 07:38 -06:00
# CI (`C1`): the document gates, the requirement trace and the test gate, on a clean macOS
# runner. The stamp and frozen-spec checks (`H5`, `H8`) read the staged index, so they run in
# the pre-commit hook only.
name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  gates:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Document gates
        run: sh scripts/check_docs.sh
      - name: Requirement trace
        # The ratchet compares with the commit this change starts from, not with itself.
        run: |
          if [ -n "$GITHUB_BASE_REF" ]; then base=$(git merge-base HEAD "origin/$GITHUB_BASE_REF")
          else base="${{ github.event.before }}"; fi
          git cat-file -e "$base^{commit}" 2>/dev/null || base=HEAD^
          echo "ratchet base: $base"
          python3 scripts/check_trace.py --base "$base"
      - name: Tests and floor
        run: sh scripts/test_gate.sh
      - name: App and widget compile
        run: sh scripts/build_apps.sh
